<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HSSCM 오늘 저녁 뭐 먹지?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#DCE6EE; --paper:#FFFFFF; --ink:#16212B; --muted:#5D6B78;
  --yellow:#FFC93C; --red:#E8452C; --line:#B9C6D2; --chip:#F2F6F9;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A22; --paper:#1E2A35; --ink:#EEF3F7; --muted:#9AA9B6;
    --yellow:#FFC93C; --red:#FF6A50; --line:#33424F; --chip:#26343F; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A22; --paper:#1E2A35; --ink:#EEF3F7; --muted:#9AA9B6;
  --yellow:#FFC93C; --red:#FF6A50; --line:#33424F; --chip:#26343F; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:16px; line-height:1.5}
main{max-width:440px; margin:0 auto; padding:28px 18px 48px}
.lab{font-family:"Black Han Sans",sans-serif; font-size:18px; color:var(--muted); margin:0}
h1{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif; font-weight:400;
  font-size:clamp(40px,12vw,56px); line-height:1.05; margin:2px 0 24px; word-break:keep-all}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--chip);
  border:1.5px solid var(--line); border-radius:16px; padding:5px}
.seg button{font-family:"Black Han Sans",sans-serif; font-size:24px; padding:12px 8px; border:0; border-radius:12px;
  background:transparent; color:var(--muted); cursor:pointer}
.seg button small{display:block; font-family:"IBM Plex Sans KR",sans-serif; font-size:12px; font-weight:400}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.special{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin:10px 0 22px;
  font:inherit; font-size:14px; color:var(--muted); background:none; border:1.5px dashed var(--line);
  border-radius:12px; padding:8px; cursor:pointer}
.special[aria-pressed="true"]{color:var(--red); border-color:var(--red); border-style:solid; font-weight:600}
.btn{font-family:"Black Han Sans",sans-serif; font-size:26px; width:100%; border:0; border-radius:14px; padding:16px;
  cursor:pointer; background:var(--yellow); color:#16212B; box-shadow:0 4px 0 #C99A1C}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #C99A1C}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.slot{height:0; overflow:hidden; text-align:center; font-family:"Black Han Sans",sans-serif; font-size:30px; transition:height .2s; word-break:keep-all}
.slot.on{height:64px; line-height:64px}
.printer{margin-top:22px}
.printer::before{content:""; display:block; height:12px; border-radius:6px; background:var(--ink); opacity:.9}
.receipt{background:var(--paper); margin:0 10px; padding:20px 18px 32px;
  font-family:"Nanum Gothic Coding",ui-monospace,monospace; font-size:14px; clip-path:inset(0 0 100% 0);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6px,#000 7px) 0 0/16px 100% repeat-x;
  mask:radial-gradient(circle 7px at 50% 100%,transparent 6px,#000 7px) 0 0/16px 100% repeat-x}
.receipt.show{animation:print .9s steps(14) forwards}
@keyframes print{to{clip-path:inset(0 0 0 0)}}
.r-head{text-align:center; color:var(--muted); font-size:12px}
.dash{border:0; border-top:1.5px dashed var(--line); margin:12px 0}
.r-kind{text-align:center; color:var(--red); font-weight:700}
.r-name{font-family:"Black Han Sans",sans-serif; font-size:36px; line-height:1.15; text-align:center; margin:8px 0; word-break:keep-all}
.r-menu{text-align:center; font-size:16px; word-break:keep-all}
.again{display:block; width:calc(100% - 20px); margin:16px 10px 0; font:inherit; font-weight:600; font-size:15px; padding:12px;
  border-radius:12px; cursor:pointer; background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.empty{margin:16px 0 0; text-align:center; color:var(--red); font-weight:600}
details{margin-top:30px; font-size:14px}
summary{cursor:pointer; color:var(--muted); font-weight:600}
.list h3{font-size:14px; margin:14px 0 4px}
.list ul{margin:0; padding-left:18px}
.list li span{color:var(--muted)}
.foot{margin-top:28px; text-align:center}
.link{font:inherit; font-size:13px; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer}
.lock{display:flex; gap:8px; justify-content:center; margin-top:10px}
.lock input,.editor input{font:inherit; font-size:15px; color:var(--ink); background:var(--paper);
  border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0}
.small-btn{font:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer;
  background:var(--ink); color:var(--paper); border:0}
.small-btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.msg{font-size:13px; color:var(--red); text-align:center; margin:8px 0 0}
.editor{margin-top:26px; background:var(--paper); border-radius:14px; padding:16px}
.editor h2{font-family:"Black Han Sans",sans-serif; font-weight:400; font-size:22px; margin:0 0 4px}
.editor h3{font-size:15px; margin:18px 0 8px}
.erow{display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-bottom:6px}
.del{width:36px; border:0; background:none; color:var(--red); font-size:20px; cursor:pointer}
.add{font:inherit; font-size:14px; color:var(--ink); background:var(--chip); border:1.5px dashed var(--line);
  border-radius:10px; padding:6px; width:100%; cursor:pointer}
.ebar{display:flex; gap:8px; justify-content:flex-end; margin-top:18px}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){ .receipt.show{animation:none; clip-path:none} .slot{transition:none} }
</style>
</head>
<body>
<main id="root">
  <p class="lab">HSSCM</p>
  <h1>오늘 저녁 뭐 먹지?</h1>

  <div class="seg" id="seg">
    <button data-k="delivery" aria-pressed="true">배달<small>연구실에서</small></button>
    <button data-k="out" aria-pressed="false">외출<small>나가서 먹기</small></button>
  </div>
  <button class="special" id="special" data-k="special" aria-pressed="false">🎉 특별한 날이면 특식</button>

  <button class="btn" id="pick">뽑기</button>
  <div class="slot" id="slot" aria-hidden="true"></div>
  <p class="empty" id="empty" hidden></p>

  <div class="printer" id="printer" hidden>
    <div class="receipt" id="receipt" aria-live="polite"></div>
    <button class="again" id="again">다른 데 다시 뽑기</button>
  </div>

  <details>
    <summary>전체 목록 보기</summary>
    <div class="list" id="list"></div>
  </details>

  <div class="foot">
    <button class="link" id="openLock">목록 수정</button>
    <div class="lock" id="lock" hidden>
      <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="off">
      <button class="small-btn" id="unlock">확인</button>
    </div>
    <p class="msg" id="lockMsg" hidden></p>
  </div>

  <section class="editor" id="editor" hidden></section>
</main>
<script type="application/json" id="menu-data">
{"delivery":[["카츠헤세드","돈까스, 파스타"],["B사감","김밥, 닭강정"],["오늘은 오므라이스 광진점","오므라이스"],["닭플릭스","찜닭"],["백쉐프","초밥, 회덮밥"],["통큰직화제육","제육덮밥"],["호랑이초밥","초밥"],["짜글이대가","짜글이(김치찜)"],["마라탕집(미정)","마라탕, 마라샹궈"],["양가네명품갈비찜","갈비찜"],["우기파스타","파스타, 리조또"],["우마이라멘&마제소바","마제소바, 라멘"],["찬스불고기부리또","부리또, 치미창가"],["롯데리아","햄버거"],["맥도날드","햄버거"]],
"out":[["장수마을","한식(김치찌개 등)"],["미식반점","중식(짜장면 등)"],["민수네","제육볶음"],["세종원","중식(짜장면 등)"],["강설옥","설렁탕"]],
"special":[["명륜진사갈비","돼지갈비 무한리필"],["춘천골 닭갈비","닭갈비"],["용두동할매쭈꾸미","쭈꾸미 삼겹살"],["계주옥","숯불닭갈비"],["장수마을","삼겹살, 목살"],["삼류구돈","삼겹살, 목살"]]}
</script>
<script id="app">
(function(){
const PASSWORD = "HSSCM";
const LABEL = {delivery:"배달", out:"외출", special:"특식"};
const SOURCE = {
  style: document.getElementById("app-style").textContent,
  body: document.getElementById("root").innerHTML,
  app: document.getElementById("app").textContent
};
let DATA = JSON.parse(document.getElementById("menu-data").textContent);
let kind = "delivery";
let skipped = new Set();
let current = null;
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };

function setKind(k){
  kind = k; skipped.clear();
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  $("special").setAttribute("aria-pressed", k === "special");
  $("printer").hidden = true; $("empty").hidden = true;
}
$("seg").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setKind(b.dataset.k); });
$("special").addEventListener("click", () => setKind(kind === "special" ? "delivery" : "special"));

function pick(){
  const all = DATA[kind] || [];
  let list = all.filter(r => !skipped.has(r[0] + "|" + r[1]));
  $("empty").hidden = true;
  if(!all.length){ $("printer").hidden = true; $("empty").textContent = LABEL[kind] + " 목록이 비어 있어요. 목록 수정에서 추가해 주세요."; $("empty").hidden = false; return; }
  if(!list.length){ skipped.clear(); list = all; }
  const r = list[Math.floor(Math.random() * list.length)];
  $("printer").hidden = true;
  if(reduce || all.length < 2){ show(r); return; }
  const slot = $("slot"); slot.classList.add("on");
  let i = 0;
  const t = setInterval(() => {
    slot.textContent = all[Math.floor(Math.random() * all.length)][0];
    if(++i > 14){ clearInterval(t); slot.classList.remove("on"); slot.textContent = ""; show(r); }
  }, 70);
}

function show(r){
  current = r;
  const rc = $("receipt"); rc.textContent = "";
  const now = new Date().toLocaleString("ko-KR", {month:"long", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit"});
  rc.append(
    el("div","r-head","HSSCM 저녁 주문표 · " + now),
    el("hr","dash"),
    el("div","r-kind", LABEL[kind]),
    el("div","r-name", r[0]),
    el("div","r-menu", r[1]),
    el("hr","dash"),
    el("div","r-head","오늘도 연구하느라 수고했어요")
  );
  $("printer").hidden = false;
  rc.classList.remove("show"); void rc.offsetWidth; rc.classList.add("show");
}
$("pick").addEventListener("click", pick);
$("again").addEventListener("click", () => { if(current) skipped.add(current[0] + "|" + current[1]); pick(); });

function renderList(){
  const box = $("list"); box.textContent = "";
  ["delivery","out","special"].forEach(k => {
    box.append(el("h3", null, LABEL[k] + " (" + DATA[k].length + ")"));
    const ul = el("ul");
    DATA[k].forEach(r => { const li = el("li", null, r[0] + " "); li.append(el("span", null, "· " + r[1])); ul.append(li); });
    box.append(ul);
  });
}
renderList();

/* ---------- 수정 ---------- */
function lockMsg(t){ $("lockMsg").textContent = t; $("lockMsg").hidden = !t; }
$("openLock").addEventListener("click", () => { $("lock").hidden = !$("lock").hidden; lockMsg(""); if(!$("lock").hidden) $("pw").focus(); });
function tryUnlock(){
  if($("pw").value.trim() === PASSWORD){ $("lock").hidden = true; $("pw").value = ""; lockMsg(""); openEditor(); }
  else lockMsg("비밀번호가 달라요.");
}
$("unlock").addEventListener("click", tryUnlock);
$("pw").addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });

let draft = null;
function openEditor(){
  draft = JSON.parse(JSON.stringify(DATA));
  renderEditor(); $("editor").hidden = false; $("editor").scrollIntoView({behavior: reduce ? "auto" : "smooth"});
}
function renderEditor(){
  const ed = $("editor"); ed.textContent = "";
  ed.append(el("h2", null, "목록 수정"));
  ["delivery","out","special"].forEach(k => {
    ed.append(el("h3", null, LABEL[k]));
    draft[k].forEach((r, i) => {
      const row = el("div","erow");
      const a = el("input"); a.value = r[0]; a.placeholder = "식당 이름"; a.setAttribute("aria-label", LABEL[k] + " 식당 이름");
      a.oninput = () => draft[k][i][0] = a.value;
      const b = el("input"); b.value = r[1]; b.placeholder = "메뉴 예시"; b.setAttribute("aria-label", LABEL[k] + " 메뉴 예시");
      b.oninput = () => draft[k][i][1] = b.value;
      const d = el("button","del","×"); d.setAttribute("aria-label", (r[0] || "빈 줄") + " 삭제");
      d.onclick = () => { draft[k].splice(i,1); renderEditor(); };
      row.append(a, b, d); ed.append(row);
    });
    const add = el("button","add","+ " + LABEL[k] + " 식당 추가");
    add.onclick = () => { draft[k].push(["",""]); renderEditor(); };
    ed.append(add);
  });
  const bar = el("div","ebar");
  const cancel = el("button","small-btn ghost","취소"); cancel.onclick = () => { $("editor").hidden = true; draft = null; };
  const save = el("button","small-btn","수정된 파일 받기"); save.onclick = () => saveDraft(save);
  bar.append(cancel, save); ed.append(bar);
  const m = el("p","msg"); m.id = "saveMsg"; m.hidden = true; ed.append(m);
}
function saveMsg(t){ const m = $("saveMsg"); m.textContent = t; m.hidden = !t; }

function buildDocument(data){
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const app = SOURCE.app.replace(/<\/script/gi, "<\\/script");
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<meta name="robots" content="noindex, nofollow">\n' +
    '<title>HSSCM 오늘 저녁 뭐 먹지?</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">\n' +
    '<style id="app-style">' + SOURCE.style + '</style>\n</head>\n<body>\n' +
    '<main id="root">' + SOURCE.body + '</main>\n' +
    '<script type="application/json" id="menu-data">\n' + json + '\n<\/script>\n' +
    '<script id="app">' + app + '<\/script>\n</body>\n</html>\n';
}

function saveDraft(btn){
  const clean = {};
  ["delivery","out","special"].forEach(k => {
    clean[k] = draft[k].map(r => [r[0].trim(), r[1].trim()]).filter(r => r[0]);
  });
  const blob = new Blob([buildDocument(clean)], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  DATA = clean; renderList(); skipped.clear();
  saveMsg("index.html을 받았어요. GitHub에 올린 기존 파일을 이 파일로 바꾸면 모두에게 반영돼요.");
}
})();
</script>
</body>
</html>
